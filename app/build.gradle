apply plugin: 'com.android.application'
apply plugin: 'com.google.protobuf'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 30
    defaultConfig {
        applicationId "net.ijoon.ijoonweatherstation"
        minSdkVersion 19
        targetSdkVersion 30
        versionCode 43
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    protobuf {
        protoc {
            if (osdetector.os == "osx") {
                artifact = 'com.google.protobuf:protoc:3.14.0:osx-x86_64'
            } else {
                artifact = 'com.google.protobuf:protoc:3.14.0'
            }
        }
        plugins {
            javalite {
                if (osdetector.os == "osx") {
                    artifact = 'com.google.protobuf:protoc-gen-javalite:3.0.0:osx-x86_64'
                } else {
                    artifact = 'com.google.protobuf:protoc-gen-javalite:3.0.0'
                }

            }
        }
        generateProtoTasks {
            all().each { task ->
                task.builtins {
                    remove java
                }
                task.plugins {
                    javalite {}
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:30.0.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:recyclerview-v7:30.0.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.android.support:support-v4:30.0.0'
    implementation 'com.squareup.retrofit2:retrofit:2.7.1'

    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'com.google.android.gms:play-services-auth:17.0.0'
    implementation 'com.google.android.gms:play-services-places:17.0.0'

    implementation 'com.skyfishjy.ripplebackground:library:1.0.1'

    implementation project(':scnet-android')
    implementation 'com.google.protobuf:protobuf-lite:3.0.1'

    implementation 'com.github.zzz40500:AndroidSweetSheet:1.1.0'

    implementation 'com.google.android.material:material:1.1.0'

    implementation 'com.android.support:design:30.0.0'
    //TextInputEditText

    implementation 'android.arch.work:work-runtime:1.0.1'
    implementation 'com.google.firebase:firebase-analytics:17.2.2'
    implementation 'com.google.firebase:firebase-messaging:20.1.0'
    //firebase

    implementation 'com.squareup.retrofit2:retrofit:2.7.1'
    //로그인
    implementation 'com.squareup.retrofit2:converter-gson:2.6.1'
    //QRCode
    implementation 'com.journeyapps:zxing-android-embedded:3.4.0'

    //chart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.github.vpotvin:caldroidx:1.0'
    implementation 'com.github.vpotvin:caldroidx:1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'


    //kakao
    implementation "com.kakao.sdk:v2-user:2.4.2" // 카카오 로그인
    implementation "com.kakao.sdk:v2-talk:2.4.2" // 친구, 메시지(카카오톡)
    implementation "com.kakao.sdk:v2-story:2.4.2" // 카카오스토리
    implementation "com.kakao.sdk:v2-link:2.4.2" // 메시지(카카오링크)
    implementation "com.kakao.sdk:v2-navi:2.4.2" // 카카오내비
}
