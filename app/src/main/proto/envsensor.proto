syntax = "proto3";

package envsensor;
option java_package = "net.ijoon";
option java_outer_classname = "envsensor";

enum PacketType {
  streamingStartReq = 0;
  streamingStartRes = 1;
  streamingStopReq = 2;
  streamingStopRes = 3;
  envSensorData = 4;
  getSensorListReq = 5;
  getSensorListRes = 6;
  setSensorPositionReq = 7;
  setSensorPositionRes = 8;
  registerSensor = 9;
  setSensorNameReq = 10;
  setSensorNameRes = 11;

  shareSensorReq = 12;
  shareSensorRes = 13;
  shareSensorCancelReq = 14;
  shareSensorCancelRes = 15;
  sharedUsersReq = 16;
  sharedUsersRes = 17;
  handoverSensorReq = 18;
  handoverSensorRes = 19;
  setDisclosureOptionReq = 20;
  setDisclosureOptionRes = 21;
  registSensorReq = 22;
  registSensorRes = 23;
  unregistSensorReq = 24;
  unregistSensorRes = 25;

}

message StreamingStartRequest {
  string serial = 1;
  string accessToken = 2;
}

message StreamingStartResponse {
  enum Result {
    success = 0;
    failed = 1;
  }

  Result result = 1;
  string serial = 2;
}

message StreamingStopRequest {
  string serial = 1;
  string accessToken = 2;
}

message StreamingStopResponse {
  enum Result {
    success = 0;
    failed = 1;
  }

  Result result = 1;
  string serial = 2;
}

message EnvSensorData {
  float velocity = 1;
  float direction = 2;
  float temperature = 3;
  float humidity = 4;
  float pressure = 5;
  float accX = 6;
  float accY = 7;
  float accZ = 8;
  float rain = 9;
  float luminosity = 10;
  uint32 id = 11;

  float cvelocity = 12;
  float cdirection = 13;
  float ctemperature = 14;
  float chumidity = 15;
  float cpressure = 16;
  float caccX = 17;
  float caccY = 18;
  float caccZ = 19;
  float crain = 20;
  float cluminosity = 21;

  string serial = 22;
}

message Sensor {
  uint32 id = 1;
  float latitude = 2;
  float longitude = 3;
  string name = 4;
  float maxVelocity = 5;
  string maxTime = 6;
  string serial = 7;

  string address = 8;
  string version = 9;
  uint32 ping = 10;
  string owner = 11;
  bool isPublic = 12;
  string regDate = 13;
}

message GetSensorListRequest {
  string accessToken = 1;
}

message GetSensorListResponse {
  enum Result {
    success = 0;
    failed = 1;
  }

  Result result = 1;
  repeated Sensor sensor = 2;
}

message SetSensorPositionRequest {
  string accessToken = 1;
  string serial = 2;
  float latitude = 3;
  float longitude = 4;
}

message SetSensorPositionResponse {
  enum Result {
    success = 0;
    failed = 1;
  }

  Result result = 1;
  string serial = 2;
  float latitude = 3;
  float longitude = 4;
}

message RegisterSensor {
  uint32 id = 1;
  string serial = 2;
}

message SetSensorNameRequest {
  string accessToken = 1;
  string serial = 2;
  string name = 3;
}

message SetSensorNameResponse {
  enum Result {
    success = 0;
    failed = 1;
  }

  Result result = 1;
  string serial = 2;
  string name = 3;
}

message Authority {
  bool name = 1;
  bool position = 2;
  bool sharing = 3;
  bool update = 4;
}

message ShareSensorRequest {
  string accessToken = 1;
  string serial = 2;
  string userId = 3;
  Authority auth = 4;
}

message ShareSensorResponse {
  enum Result {
    success = 0;
    expiredToken = 1;
    failed = 2;
    unauthorized = 3;
    userNotExist = 4;
  }

  Result result = 1;
  string serial = 2;
  string userId = 3;
  Authority auth = 4;
}

message ShareSensorCancelRequest {
  string accessToken = 1;
  string serial = 2;
  string userId = 3;
}

message ShareSensorCancelResponse {
  enum Result {
    success = 0;
    expiredToken = 1;
    failed = 2;
    unauthorized = 3;
    userNotExist = 4;
  }

  Result result = 1;
  string serial = 2;
  string userId = 3;
}

message SharedUsersRequest {
  string accessToken = 1;
  string serial = 2;
}

message SharedUsersResponse {
  enum Result {
    success = 0;
    expiredToken = 1;
    failed = 2;
    unauthorized = 3;
  }

  Result result = 1;
  string serial = 2;
  repeated string sharedUsers = 3;
}

message HandoverSensorRequest {
  string accessToken = 1;
  string serial = 2;
  string assigneeId = 3;
}

message HandoverSensorResponse {
  enum Result {
    success = 0;
    expiredToken = 1;
    failed = 2;
    unauthorized = 3;
    userNotExist = 4;
  }

  Result result = 1;
  string serial = 2;
  string assigneeId = 3;
}

message SetDisclosureOptionRequest {
  string accessToken = 1;
  string serial = 2;
  bool isPublic = 3;
}

message SetDisclosureOptionResponse {
  enum Result {
    success = 0;
    expiredToken = 1;
    failed = 2;
    unauthorized = 3;
  }

  Result result = 1;
  string serial = 2;
  bool isPublic = 3;
}

message RegistSensorRequest {
  string accessToken = 1;
  string serial = 2;
  string auth = 3;
  float latitude = 4;
  float longitude = 5;
}

message RegistSensorResponse {
  enum Result {
    success = 0;
    expiredToken = 1;
    failed = 2;
    unauthorized = 3;
    userNotExist = 4;
  }

  Result result = 1;
  string serial = 2;
  float latitude = 3;
  float longitude = 4;
}

message UnregistSensorRequest {
  string accessToken = 1;
  string serial = 2;
}

message UnregistSensorResponse {
  enum Result {
    success = 0;
    failed = 1;
  }

  Result result = 1;
  string serial = 2;
}

